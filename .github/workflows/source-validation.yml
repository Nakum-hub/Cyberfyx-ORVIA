name: Source validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Contracts, types, lint and unit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      BETTER_AUTH_TELEMETRY: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install the pinned package manager
        run: |
          npm install --prefix "$RUNNER_TEMP/orvia-tools" --ignore-scripts --no-audit --no-fund pnpm@12.4.2
          echo "$RUNNER_TEMP/orvia-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify generated contracts
        run: pnpm run contracts:check
      - name: Check types
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Run unit tests
        run: pnpm test
      - name: Validate historical acceptance records
        run: pnpm run tracking:check
      - name: Verify the immutable master inventory
        run: pnpm exec tsx scripts/v1-source-inventory.ts --check
      - name: Check the complete test-file inventory
        run: pnpm exec tsx scripts/qualification-inventory.ts --check

  policy-gate:
    name: Privacy policy regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The OPA image is pinned by digest to the one the installation runs. The gate runs the privacy policy tests, then applies
      # deliberate defects (withdrawn consent allowed, MFA dropped, approval granted to an administrator, ...) to a temporary copy
      # and fails unless every defect is caught.
      - name: Run the privacy policy tests and the deliberate-defect checks
        run: scripts/policy-gate.sh

# Static engineering checks only. No deployment, provider credentials, customer
# records, integration acceptance or release approval is supplied by these jobs.
