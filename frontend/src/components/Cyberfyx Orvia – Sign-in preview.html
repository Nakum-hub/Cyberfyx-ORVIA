<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyberfyx Orvia – Sign-in preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#ffab40;--purple:#351c74;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#fff;font-family:'Montserrat',system-ui,sans-serif;overflow-x:hidden}
.page{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.lockup{display:flex;align-items:center}
.shield{height:clamp(72px,14vw,120px);width:auto;transform:perspective(800px) scale(0) rotateY(-360deg);opacity:0}
.go .shield{animation:open 2.3s linear forwards}
@keyframes open{0%{transform:perspective(800px) scale(0) rotateY(-360deg);opacity:0}22%{transform:perspective(800px) scale(1) rotateY(-281deg);opacity:1}100%{transform:perspective(800px) scale(1) rotateY(0);opacity:1}}
.reveal{display:grid;grid-template-columns:0fr;opacity:0;transition:grid-template-columns 1s cubic-bezier(.22,1,.36,1),opacity 1s}
.s1 .reveal{grid-template-columns:1fr;opacity:1}
.inner{overflow:hidden;white-space:nowrap;display:flex;align-items:baseline;min-width:0}
.name,.orvia{font-weight:800;font-size:clamp(26px,7vw,72px);line-height:1.1}
.name{color:var(--purple);margin-left:clamp(10px,2vw,20px)}
.orvia{color:var(--orange);margin-left:clamp(1px,.3vw,4px);word-spacing:-.2em;padding-right:4px;opacity:0;transform:translateX(-16px);transition:opacity .6s ease-out,transform .6s ease-out}
.s2 .orvia{opacity:1;transform:none}
.formwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .9s cubic-bezier(.22,1,.36,1);width:100%;max-width:400px}
.s3 .formwrap{grid-template-rows:1fr}
.formclip{overflow:hidden;min-height:0}
form{display:flex;flex-direction:column;gap:14px;padding:40px 4px 8px;opacity:0;transform:translateY(24px);transition:opacity .8s .35s,transform .8s .35s cubic-bezier(.22,1,.36,1)}
.s3 form{opacity:1;transform:none}
label{font-weight:600;font-size:13px;color:var(--purple);margin-bottom:-6px}
input{width:100%;box-sizing:border-box;padding:14px 16px;border:1.5px solid #e4def0;border-radius:10px;font:500 15px 'Montserrat',sans-serif;color:var(--purple);background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(53,28,116,.12)}
button.sign{margin-top:8px;padding:14px;border:0;border-radius:10px;cursor:pointer;font:800 15px 'Montserrat',sans-serif;color:#fff;background:var(--purple);transition:background .2s,transform .15s}
button.sign:hover{background:#43259a}button.sign:active{transform:scale(.98)}
button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.replay{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#fff;color:var(--purple);border:1.5px solid var(--purple);border-radius:999px;padding:8px 16px;font:600 13px 'Montserrat',sans-serif;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
</style></head><body>
